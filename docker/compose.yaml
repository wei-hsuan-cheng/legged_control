services:
  legged_noetic:
    image: ${IMAGE_NAME:-legged_control:noetic}
    build:
      context: .
      args:
        USER_NAME: ${USER_NAME_IN_DOCKER:-legged}
        USER_PASSWD: ${USER_PASSWD_IN_DOCKER:-legged}
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
    container_name: legged_noetic
    privileged: true
    network_mode: host
    ipc: host
    security_opt:
      - seccomp=unconfined
    shm_size: 512m
    volumes:
      - /dev/:/dev/:rw
      - ${HOME}/src/:/home/${USER_NAME_IN_DOCKER:-legged}/src/:rw
      - /tmp/.X11-unix/:/tmp/.X11-unix:rw
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      # Same iGPU offload as aclm_workspace; set LIBGL_ALWAYS_SOFTWARE=1 if Gazebo/RViz render black
      DRI_PRIME: "1"
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-0}
      LEGGED_WS: /home/${USER_NAME_IN_DOCKER:-legged}/src/wei-hsuan-cheng/legged_ws
      ROBOT_TYPE: ${ROBOT_TYPE:-a1}
    stdin_open: true
    tty: true
    restart: unless-stopped
